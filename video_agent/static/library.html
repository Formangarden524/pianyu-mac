<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>片语 · 我的内容库</title><link rel="stylesheet" href="/static/library.css"></head><body><aside><h2>片语</h2><p>留下值得带走的内容</p><a href="/" class="active">我的内容库</a><a href="/advanced">任务与高级工作台 ↗</a><a href="/advanced#settings">处理与 Notion 设置 ↗</a></aside><main><header><div><small>我的知识收藏</small><h1>把看过的，变成自己的</h1><p>读一个观点，带走一种方法，打开新的视角。</p></div><div><button id="add">＋ 添加视频</button><button id="folder">添加文件夹</button><input id="files" type="file" accept=".mp4,.mov,.mkv,.webm" multiple hidden><input id="folders" type="file" webkitdirectory multiple hidden></div></header><p id="notice" role="status">正在读取内容库…</p><p id="upload-note" role="status"></p><details id="upload-details" hidden><summary>查看跳过和未导入的视频</summary><ul id="upload-list"></ul></details><section class="tools"><input id="search" type="search" placeholder="搜索标题、正文或作者" aria-label="搜索内容"><select id="sort" aria-label="排序"><option value="new">最近添加</option><option value="old">最早添加</option><option value="title">标题顺序</option></select><select id="tag" aria-label="主题标签"><option value="">全部主题</option></select><select id="author-filter" aria-label="作者筛选"><option value="">全部作者</option></select><label><input type="checkbox" id="favorites">仅收藏</label></section><p id="count"></p><section id="cards" aria-label="已整理内容"></section><nav class="actions"><button id="prev">上一页</button><span id="page"></span><button id="next">下一页</button></nav></main><section id="reader-empty"><h2>选择一条内容，开始阅读</h2><p>左侧快速浏览，右侧查看文案与原视频。</p></section><dialog id="detail"><button id="close" aria-label="关闭详情">×</button><small id="meta"></small><h2 id="title"></h2><p id="sync"></p><div class="actions"><button id="delete-content">联动删除</button><button id="favorite">收藏</button><button id="copy">复制文案</button><button id="edit">编辑文案</button><a id="download">下载文案</a><a id="notion" target="_blank" rel="noreferrer">Notion ↗</a></div><p id="detail-note" role="status"></p><video id="video" controls preload="none"></video><pre id="text"></pre><section id="editor" hidden><textarea id="draft" aria-label="编辑整理文案"></textarea><button id="save">保存修改</button><button id="cancel-edit">取消编辑</button></section><details><summary>作者与来源</summary><label>作者<input id="author"></label><label>来源链接<input id="source" type="url"></label><label>发布时间<input id="published" type="date"></label><button id="save-meta">保存来源信息</button><p>未知可留空；来源信息保存在本地。</p></details><details><summary>处理历史与更多操作</summary><div id="history"></div><a href="/advanced">进入高级工作台 ↗</a></details><section id="leave" hidden><p>有未保存的修改，请先保存或取消编辑。</p></section></dialog><dialog id="delete-dialog"><h2>联动移入回收站</h2><p id="delete-scope"></p><pre id="delete-paths"></pre><p id="delete-status" role="status"></p><button id="delete-confirm">执行删除</button><button id="delete-cancel">关闭</button></dialog><script src="/static/library.js?v=import-dedupe"></script></body></html>
